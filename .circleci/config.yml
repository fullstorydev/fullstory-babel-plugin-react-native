version: 2.1
executors:
  browser-executor:
    docker:
      - image: cimg/node:22.23.3
    working_directory: ~/repo
jobs:
  build-babel-plugin-react-native:
    executor: browser-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package-lock.json" }}
      - run:
          name: Install
          command: npm ci
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package-lock.json" }}
      - run:
          name: Audit
          command: npm audit --audit-level=low --omit=dev
      - run:
          name: Build
          command: npm run build
      - run:
          name: Test
          command: npm run test
      - persist_to_workspace:
          root: .
          paths: [.]
  # Oldest react-native in the supported range.
  test-min-react-native:
    executor: browser-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package-lock.json" }}
      - run:
          name: Install
          command: npm ci
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package-lock.json" }}
      - run:
          name: Install minimum react-native
          command: npm install --no-save --legacy-peer-deps react-native@0.83 react@19.2.0
      - run:
          name: Build
          command: npm run build
      - run:
          name: Test transform
          command: npx jest --selectProjects transform
  deploy-babel-plugin-react-native:
    executor: browser-executor
    steps:
      - attach_workspace:
          at: ~/repo
      - run:
          name: Authenticate with registry
          command: echo "//registry.npmjs.org/:_authToken=$npm_TOKEN" > .npmrc
      - run:
          name: Publish package
          command: npm publish --access public
workflows:
  version: 2
  test-deploy:
    jobs:
      - build-babel-plugin-react-native:
          filters:
            # test on all branches and tags (all branches are included by default)
            tags:
              only: /.*/
      - test-min-react-native:
          filters:
            tags:
              only: /.*/
      - hold:
          type: approval
          requires:
            - build-babel-plugin-react-native
            - test-min-react-native
          filters:
            # hold only on version tags
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - deploy-babel-plugin-react-native:
          requires:
            - hold
          filters:
            # deploy only on version tags
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
